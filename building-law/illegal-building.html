        <h1>違建會被罰嗎？處理方式整理</h1>
        <p class="article-lead">
          違章建築是否會裁罰或拆除，會依建物位置、興建時間、違規型態、公共安全風險與地方政府執行規則而不同。
        </p>

        <section>
          <h2>常見處理方向</h2>
          <p>
            常見處理方式包含申報列管、限期改善、補辦程序、拆除或裁罰。
            如果違建涉及防火避難、結構安全、公共通道或占用公共空間，通常風險較高，也較可能被優先處理。
          </p>
        </section>

        <section>
          <h2>查詢前可先準備</h2>
          <p>
            建議先確認建物地址、違建位置、興建時間、現況照片、是否收到公文，以及是否影響逃生、防火或鄰地權益。
            這些資訊會影響應查的中央法規與地方違章建築處理規則。
          </p>
        </section>
