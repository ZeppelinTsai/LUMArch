    <!-- 結構化資料（SEO加分） -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Blog",
        "name": "建築法規知識庫",
        "description": "整理台灣建築法規與申請流程",

  <body class="blog-body">
    <main class="blog-page">
      <nav class="blog-nav" aria-label="頁面導覽">
        <a href="../index.html" class="back-link">回到 AI 查詢</a>
        <span>LUMArch 建築法規整理</span>
      </nav>

      <header class="blog-hero">
        <div>
          <p class="blog-kicker">Knowledge Base</p>
          <h1>建築法規知識庫</h1>
          <p class="blog-lead">
            整理改建、增建、違建與建造執照的常見判斷重點，協助你在施工或諮詢前先掌握方向。

    </main>
    <script>
      async function loadArticles() {
        const res = await fetch("./articles.json");
        const articles = await res.json();

        const container = document.getElementById("blogList");

        container.innerHTML = articles
          .map(
            (a) => `
    <article class="blog-card">
      <div class="blog-tag">${a.tag}</div>
      <h2>
        <a href="./${a.url}">${a.title}</a>
      </h2>
      <p>${a.desc}</p>
    </article>
  `,
          )
          .join("");
      }

      loadArticles();
    </script>
  </body>
